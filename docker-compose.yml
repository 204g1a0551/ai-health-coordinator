version: '3.9'

services:

  # ── FastAPI Backend ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: health-backend
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GEMINI_MODEL=gemini-2.0-flash
      - JWT_SECRET=${JWT_SECRET:-healthcare_super_secret_jwt_key_2024}
      - REDIS_HOST=127.0.0.1
      - REDIS_PORT=6379
      - REDIS_SESSION_TTL_SECONDS=86400
      - REDIS_CACHE_TTL_SECONDS=3600
      - REDIS_HOLD_TTL_SECONDS=600
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ── Angular Frontend ────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: health-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
