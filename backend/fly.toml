app = "ai-health-backend"
primary_region = "sin"       # Singapore — closest free region to India

[build]
  dockerfile = "Dockerfile"

[env]
  GEMINI_MODEL = "gemini-2.0-flash"
  REDIS_HOST = "127.0.0.1"
  REDIS_PORT = "6379"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
