services:
  - type: web
    name: ai-health-coordinator-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: JWT_SECRET
        generateValue: true
      - key: REDIS_HOST
        value: 127.0.0.1
      - key: REDIS_PORT
        value: "6379"
      - key: REDIS_SESSION_TTL_SECONDS
        value: "86400"
      - key: REDIS_CACHE_TTL_SECONDS
        value: "3600"
      - key: REDIS_HOLD_TTL_SECONDS
        value: "600"
